name: Mise à jour des taux (Banque du Canada)

# Se déclenche automatiquement chaque jour, et manuellement au besoin.
on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC chaque jour (~7 h, heure de l'Est)
  workflow_dispatch: {}      # bouton « Run workflow » dans l'onglet Actions

permissions:
  contents: write            # autorise le robot à committer le fichier mis à jour

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Récupérer les taux
        run: node scripts/update-rates.mjs

      - name: Committer si les taux ont changé
        run: |
          if [ -n "$(git status --porcelain data/rates-marche.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/rates-marche.json
            git commit -m "Mise à jour automatique des taux du marché ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "Aucun changement dans les taux — rien à committer."
          fi
